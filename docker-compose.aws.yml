services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_a_generated_postgres_password}

  api:
    restart: unless-stopped
    environment:
      FERAS_DATABASE_URL: postgresql://feras:${POSTGRES_PASSWORD:?set_a_generated_postgres_password}@postgres:5432/feras
      FERAS_SOLANA_RPC_URL: ${FERAS_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      FERAS_PROGRAM_ID: ${FERAS_PROGRAM_ID:-3UJi7D53Cbj5TLGbbxFCzqW9vE7Ji5N5KKEdbQMWFaFA}
      FERAS_DEVNET_USDC_MINT: ${FERAS_DEVNET_USDC_MINT:-CwhBMtAs7tAHSabWrW2Dg2hgQ7Ktt7pW86UR35Be9VrU}

  coordinator:
    restart: unless-stopped
    environment:
      FERAS_DATABASE_URL: postgresql://feras:${POSTGRES_PASSWORD:?set_a_generated_postgres_password}@postgres:5432/feras
      FERAS_STOCKFISH_PATH: /usr/games/stockfish
      FERAS_WORKER_POLL_MS: ${FERAS_WORKER_POLL_MS:-1000}
      FERAS_AUTO_PAIR_ENABLED: ${FERAS_AUTO_PAIR_ENABLED:-false}
      FERAS_AUTO_PAIR_MINUTES: ${FERAS_AUTO_PAIR_MINUTES:-15}
      FERAS_MARKET_SIGNER_MODE: ${FERAS_MARKET_SIGNER_MODE:-manual}
      FERAS_AUTOMATION_PLATFORM_KEYPAIR_PATH: /run/secrets/feras-platform.json
      FERAS_AUTOMATION_SETTLEMENT_KEYPAIR_PATH: /run/secrets/feras-settlement.json
      FERAS_SOLANA_RPC_URL: ${FERAS_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      FERAS_PROGRAM_ID: ${FERAS_PROGRAM_ID:-3UJi7D53Cbj5TLGbbxFCzqW9vE7Ji5N5KKEdbQMWFaFA}
      FERAS_DEVNET_USDC_MINT: ${FERAS_DEVNET_USDC_MINT:-CwhBMtAs7tAHSabWrW2Dg2hgQ7Ktt7pW86UR35Be9VrU}
      FERAS_TREASURY_TOKEN_ACCOUNT: ${FERAS_TREASURY_TOKEN_ACCOUNT:-2QVchBYWwYCD3gmvidgeTmT85svxXv6EXkLtjLjoJak1}
      FERAS_PLATFORM_AUTHORITY: ${FERAS_PLATFORM_AUTHORITY:-HgVKTqd9GzfaPq9sp2uMJD9i8WTGmc1Z52Xt8jF27A85}
      FERAS_SETTLEMENT_AUTHORITY: ${FERAS_SETTLEMENT_AUTHORITY:-49zdSpbUVUfN9JNSaEGCSJwZNtFyTDh8H2DwkVXhUCHq}

  migrate:
    environment:
      FERAS_DATABASE_URL: postgresql://feras:${POSTGRES_PASSWORD:?set_a_generated_postgres_password}@postgres:5432/feras
