name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Restore release signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/feras-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=app/feras-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed ARM64 APK
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          export FERAS_NODE_EXECUTABLE="$(command -v node)"
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee /tmp/feras-gradle.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            details=$(tail -n 25 /tmp/feras-gradle.log | tr '\n' ' ' | sed 's/::/: :/g')
            echo "::error title=Feras Android release build failed::$details"
            exit "$result"
          fi

      - name: Create checksum
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Feras-${{ github.ref_name }}.apk
          sha256sum Feras-${{ github.ref_name }}.apk > Feras-${{ github.ref_name }}.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              Feras-${{ github.ref_name }}.apk \
              Feras-${{ github.ref_name }}.apk.sha256 \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              Feras-${{ github.ref_name }}.apk \
              Feras-${{ github.ref_name }}.apk.sha256 \
              --generate-notes
          fi
